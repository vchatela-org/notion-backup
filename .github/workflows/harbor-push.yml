name: Build and push to Harbor

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: vchatela-org/shared-workflows/.github/workflows/docker-build-push-harbor.yml@v1
    with:
      harbor_registry: ${{ vars.HARBOR_REGISTRY }}
      harbor_project: ${{ vars.HARBOR_PROJECT }}
      harbor_image: ${{ vars.HARBOR_IMAGE }}
      max_critical_vulns: 0
      # The remaining highs are Debian 13 packages with no fixed version
      # (util-linux, ncurses, systemd, acl, perl-base) plus one Go stdlib
      # finding inside rclone 1.75.2.
      max_high_vulns: 60
    secrets:
      harbor_username: ${{ secrets.HARBOR_USERNAME }}
      harbor_password: ${{ secrets.HARBOR_PASSWORD }}
